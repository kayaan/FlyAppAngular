@if (vm(); as vm) {

<div class="replay-controls">
  <div class="replay-actions">
    <button
      type="button"
      class="replay-button"
      title="Play backward"
      [class.is-active]="
          vm.active &&
          !vm.paused &&
          vm.direction === -1
        "
      [disabled]="!vm.hasTrack"
      (click)="playBackward()"
    >
      ◀
    </button>
    <button
      type="button"
      class="replay-button"
      title="Play forward"
      [class.is-active]="
      vm.active &&
      !vm.paused &&
      vm.direction === 1
    "
      [disabled]="!vm.hasTrack"
      (click)="playForward()"
    >
      ▶
    </button>

    <button
      type="button"
      class="replay-button"
      title="Pause"
      [disabled]="!vm.active || vm.paused"
      (click)="pause()"
    >
      ❚❚
    </button>

    <button
      type="button"
      class="replay-button"
      title="Stop"
      [disabled]="
      !vm.active &&
      vm.rawIndex === null
    "
      (click)="stop()"
    >
      ■
    </button>

    <select
      class="replay-speed"
      title="Replay speed"
      [value]="vm.speedValue"
      [disabled]="!vm.hasTrack"
      (change)="onSpeedChange($event)"
    >
      @for (speed of speedOptions; track speed) {
      <option [value]="speed">
        {{ speed }}x
      </option>
      }
    </select>

    <label class="replay-control-group">
      <span>Trail</span>

      <select
        [value]="vm.trailDurationValue"
        (change)="onTrailDurationChange($event)"
      >
        <option value="full">Full</option>
        <option value="60">60s</option>
        <option value="120">120s</option>
        <option value="300">300s</option>
        <option value="custom">Custom</option>
      </select>
    </label>

    @if (vm.showCustomTrailDuration) {
    <label class="
        replay-control-group
        replay-custom-trail
      ">
      <span>Seconds</span>

      <input
        type="number"
        min="1"
        step="1"
        [value]="vm.customTrailDurationSec"
        (change)="
          onCustomTrailDurationChange($event)
        "
      />
    </label>
    }

    <label class="replay-follow-toggle">
      <input
        type="checkbox"
        [checked]="vm.cameraFollowEnabled"
        (change)="toggleCameraFollow($event)"
      />

      <span>Follow camera</span>
    </label>
  </div>

  <div class="replay-slider-area">
    <input
      class="replay-slider"
      type="range"
      [min]="vm.minIndex"
      [max]="vm.maxIndex"
      [value]="vm.index"
      [disabled]="!vm.hasTrack"
      (pointerdown)="onSliderPointerDown()"
      (input)="onSliderInput()"
      (change)="onSliderCommit($event)"
    />

    <span class="replay-index">
      {{ vm.index }} / {{ vm.maxIndex }}
    </span>
  </div>
  ```

</div>
}
