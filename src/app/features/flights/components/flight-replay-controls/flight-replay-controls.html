<div class="replay-controls">
    <button type="button" class="replay-button primary" (click)="playOrResume()"
        [disabled]="!hasTrack() || (replayActive() && !replayPaused())">
        ▶
    </button>

    <button type="button" class="replay-button" (click)="pause()" [disabled]="!replayActive() || replayPaused()">
        ❚❚
    </button>

    <button type="button" class="replay-button" (click)="stop()"
        [disabled]="!replayActive() && store.replay().index === null">
        ■
    </button>

    <input class="replay-slider" type="range" min="0" [max]="maxIndex()" [value]="replayIndex()"
        (pointerdown)="onSliderPointerDown()" (input)="onSliderInput()" (change)="onSliderCommit($event)"
        [disabled]="!hasTrack()" />
    <span class="replay-index">
        {{ replayIndex() }} / {{ maxIndex() }}
    </span>

    <select class="replay-speed" [value]="replaySpeedValue()" (change)="onSpeedChange($event)" [disabled]="!hasTrack()">
        @for (speed of speedOptions; track speed) {
        <option [value]="speed">{{ speed }}x</option>
        }
    </select>
</div>
