name: Azure Static Web Apps CI/CD

# This enables the manual "Run workflow" button in GitHub
on:
  workflow_dispatch:

jobs:
  build_and_deploy_job:
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true
          lfs: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' # Verwendet die LTS-Version 20 (kompatibel mit modernen Angular-Versionen)
          cache: 'npm'       # Aktiviert schnelles Caching für deine node_modules

      - name: Install Dependencies
        run: npm ci

      - name: Build Angular App
        run: npm run build -- --configuration=production

      - name: Install SWA CLI & Deploy to Azure
        env:
          # Hier wird dein bestehendes GitHub Secret als Umgebungsvariable übergeben
          SWA_CLI_DEPLOYMENT_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_GREEN_MEADOW_0BB9C2503 }}
        run: |
          npm install -g @azure/static-web-apps-cli
          swa deploy ./dist/flight-app-angular/browser --env production
